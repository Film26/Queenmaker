<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QueenMaker CRM — Admin Login</title>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login">
  
  <div class="login-wrapper">
    <!-- Left Section: Branding -->
    <div class="login-left">
      <div class="logo-container">
        <!-- Logo temporarily removed - bring back: <img src="./369223.png" class="big-logo" alt="QueenMaker Logo"> -->!
        </div>
    </div>
    <!-- Right Section: Login Form -->
    <div class="login-right">
      <div class="login-card">
        <h2>ADMIN LOGIN</h2>
        
        <form class="login-form">
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Username" required>
          </div>

          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
            <i class="fas fa-eye-slash toggle-pass" id="togglePassword"></i>
          </div>

          <a href="#" class="forgot-link">Forgot password?</a>

          <button type="submit" id="loginBtn" class="btn-login">LOGIN</button>

          <div id="feedback" style="margin-top: 15px; font-size: 0.9rem; min-height: 20px;"></div>
        </form>

        <div style="display:flex; align-items:center; gap:10px; margin:14px 0; color:#999; font-size:0.85rem;">
          <div style="flex:1; height:1px; background:#e0e0e0;"></div>
          <span>OR</span>
          <div style="flex:1; height:1px; background:#e0e0e0;"></div>
        </div>

        <button type="button" id="googleLoginBtn" style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:10px; border:1px solid #dadce0; border-radius:6px; background:#fff; color:#3c4043; font-size:0.9rem; box-sizing:border-box; cursor:pointer;">
          <i class="fab fa-google"></i> Sign in with Google
        </button>

        <div class="login-card-footer">
          Don't have an account? <a href="#">Contact Support</a>
        </div>
      </div>

      <div class="login-footer">
        © 2026 QueenMaker Team
      </div>
    </div>
  </div>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const feedback = document.getElementById('feedback');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    // "Sign in with Google" opens api/auth/google/start.js in a small popup instead of
    // navigating this tab away to accounts.google.com - the popup handles the whole OAuth
    // round trip (including api/auth/google/callback.js, which sets the session cookie)
    // and reports back here via postMessage before closing itself. GOOGLE_ERROR_MESSAGES
    // keys must match the `deny()` reason strings used in callback.js.
    const GOOGLE_ERROR_MESSAGES = {
      not_authorized: 'บัญชี Google นี้ยังไม่ได้รับสิทธิ์เข้าใช้งาน กรุณาติดต่อผู้ดูแลระบบ',
      denied: 'ยกเลิกการเข้าสู่ระบบด้วย Google',
      email_not_verified: 'อีเมล Google นี้ยังไม่ได้ยืนยัน กรุณายืนยันอีเมลกับ Google ก่อน',
      not_configured: 'ยังไม่ได้ตั้งค่า Google Sign-in บนระบบนี้'
    };

    const googleLoginBtn = document.getElementById('googleLoginBtn');
    let googlePopup = null;
    let googlePopupWatcher = null;

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return; // ignore messages from anywhere but our own popup
      const data = event.data;
      if (!data || data.source !== 'queenmaker-google-auth') return;

      clearInterval(googlePopupWatcher);
      googleLoginBtn.disabled = false;

      if (data.status === 'success') {
        feedback.textContent = 'Login สำเร็จ! กำลังเข้าสู่ระบบ...';
        feedback.style.color = '#198754';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
      } else {
        feedback.textContent = GOOGLE_ERROR_MESSAGES[data.reason] || 'เข้าสู่ระบบด้วย Google ไม่สำเร็จ กรุณาลองใหม่';
        feedback.style.color = '#dc3545';
      }
    });

    googleLoginBtn.addEventListener('click', () => {
      feedback.textContent = '';
      const width = 480, height = 600;
      const left = window.screenX + (window.outerWidth - width) / 2;
      const top = window.screenY + (window.outerHeight - height) / 2;
      googlePopup = window.open('/api/auth/google/start', 'queenmaker-google-login', `width=${width},height=${height},left=${left},top=${top}`);

      if (!googlePopup) {
        // Popup blocked by the browser - fall back to a normal full-page redirect instead
        // of leaving the button silently doing nothing.
        window.location.href = '/api/auth/google/start';
        return;
      }

      googleLoginBtn.disabled = true;
      googlePopupWatcher = setInterval(() => {
        if (googlePopup.closed) {
          clearInterval(googlePopupWatcher);
          googleLoginBtn.disabled = false; // user closed the popup without finishing - let them retry
        }
      }, 500);
    });

    // Password visibility toggle
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });

    // Login Logic - validated server-side against the real user store (see /api/auth/login
    // in server.js), not a hardcoded client-side check.
    document.querySelector('.login-form').addEventListener('submit', function(e){
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      loginBtn.disabled = true;
      loginBtn.textContent = 'SIGNING IN...';
      loginBtn.style.opacity = '0.8';
      feedback.textContent = '';

      fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      }).then(res => res.json().then(body => ({ ok: res.ok, body }))).then(({ ok, body }) => {
        if (ok) {
          feedback.textContent = 'Login สำเร็จ! กำลังเข้าสู่ระบบ...';
          feedback.style.color = '#198754';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
        } else {
          loginBtn.disabled = false;
          loginBtn.textContent = 'LOGIN';
          loginBtn.style.opacity = '1';
          feedback.textContent = body.error || 'Username หรือ Password ไม่ถูกต้อง';
          feedback.style.color = '#dc3545';

          // Shake animation effect
          const card = document.querySelector('.login-card');
          card.style.animation = 'none';
          void card.offsetWidth;
          card.style.animation = 'shake 0.4s ease-in-out';
        }
      }).catch(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = 'LOGIN';
        loginBtn.style.opacity = '1';
        feedback.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
        feedback.style.color = '#dc3545';
      });
    });

    // Add shake animation to CSS dynamically or via styles.css
  </script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
    }
  </style>
</body>
</html>
